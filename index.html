<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Security Verification</title>
  <style>
    body {
      margin: 0;
      background: #f3f5f7;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo {
      margin-bottom: 10px;
    }

    .logo img {
      max-width: 120px;
      height: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: #111;
      color: #0A66C2;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="logo">
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/ca/LinkedIn_logo_initials.png" alt="Company Logo">
    </div>

    <h2>Account Verification</h2>
    <p>Suspicious login detected. Please confirm access.</p>

    <input type="text" placeholder="Email">
    <input type="password" placeholder="Password">

    <button onclick="phished()">Log In</button>
  </div>

  <script>
    function phished() {
      alert("You got phished!");
    }
  </script>
</body>
</html>
